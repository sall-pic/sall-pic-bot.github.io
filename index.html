<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Image Cleaner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- ЛОГОТИП И ЗАГОЛОВОК -->
        <header class="header">

            <div class="logo">❤️</div>

           <h1 id="title">Image Cleaner</h1>

            <p id="subtitle">
                Удали цензуру вручную,<br>
                используя оригинальную версию изображения.
            </p>

             <button id="languageToggle">
    <span id="languageFlag" class="flag flag-ru"></span>
<span id="languageCode">RU</span>
</button>

        </header>

        <!-- ЗАГРУЗКА -->
        <section class="upload-section">

            <div class="section-title">
                <h2 id="preparation">Подготовка</h2>

                <p id="preparationText">
    Загрузи две версии одного изображения
</p>
            </div>

            <!-- ЦЕНЗУРНАЯ -->
            <label class="upload-card">

                <div class="upload-icon">
                    ▣
                </div>

                <div class="upload-info">
                    <strong id="censored">Цензурная картинка</strong>
                    <span id="censoredText">Версия с цензурой</span>
                </div>

                <div class="upload-actions">

    <div class="upload-button" id="censoredSelect">
        Выбрать
    </div>

    <div class="upload-button replace-button" id="censoredChange">
        Заменить
    </div>

</div>
                
                <input
                    type="file"
                    id="censoredInput"
                    accept="image/*"
                >

            </label>

            <!-- ОРИГИНАЛ -->
            <label class="upload-card">

                <div class="upload-icon">
                    ◉
                </div>

                <div class="upload-info">
                    <strong id="original">Оригинальная картинка</strong>
                    <span id="originalText">Версия без цензуры</span>
                </div>

               <div class="upload-actions">

    <div class="upload-button" id="originalSelect">
        Выбрать
    </div>

    <div class="upload-button replace-button" id="originalChange">
        Заменить
    </div>

</div>
                
                <input
                    type="file"
                    id="originalInput"
                    accept="image/*"
                >

            </label>

        </section>

        <!-- РЕДАКТОР -->
        <section class="editor-section">

            <div class="editor-header">

                <div>
                    <h2 id="editor">Редактор</h2>
                    <p id="editorText">Стирай пальцем/мышкой по изображению</p>
                </div>

               <span class="editor-badge" id="eraser">
    ✦ Ластик
</span>

            </div>


            <div class="editor" id="imageContainer">

                <canvas id="originalCanvas"></canvas>

                <canvas id="censoredCanvas"></canvas>

            </div>

            <!-- ЛАСТИК -->
            <div class="brush-controls">

                <div class="brush-top">

                    <span id="brushSizeText">
    Размер ластика
</span>
                    <strong>
                        <span id="brushSizeValue">80</span> px
                    </strong>

                </div>


                <input
                    type="range"
                    id="brushSize"
                    min="10"
                    max="500"
                    value="80"
                >

                <div class="range-labels">

                    <span>10</span>

                    <span>500 px</span>

                </div>

            </div>

<div class="editor-actions">

    <button type="button" id="undoButton" disabled>
        ↶ <span id="undoButtonText">Отменить</span>
    </button>

    <button type="button" id="resetButton" disabled>
        ↻ <span id="resetButtonText">Сбросить</span>
    </button>

    <div class="save-container">

        <button type="button" id="saveButton" class="save-button" disabled>
            <span id="saveButtonText">Сохранить</span>
            <span id="saveArrow">▾</span>
        </button>

        <div id="saveMenu" class="save-menu">

            <button type="button" id="saveCensored">
                Цензурную картинку
            </button>

            <button type="button" id="saveOriginal">
                Оригинальную картинку
            </button>

            <button type="button" id="saveBoth">
                Обе картинки
            </button>

        </div>

    </div>

</div>

        </section> 

        <footer>
    Image Cleaner
    <span>•</span>
    Telegram Mini App
</footer>

    </main>

    <script src="app.js"></script>
    
</body>
</html>
